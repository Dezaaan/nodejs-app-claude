# Load balancer for the scaled API (docker compose --profile scaling).
worker_processes auto;

events {
  worker_connections 8192;
}

http {
  # Thousands of lines per second would cost more than the proxying itself.
  access_log off;

  # Docker's DNS. Looking "api" up again every few seconds picks up copies
  # added or removed with --scale, without restarting nginx.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream api {
    zone api 64k;
    # Sends each request to the copy with the fewest requests in progress.
    least_conn;
    server api:3000 resolve;

    # Reuses connections to the copies instead of opening one per request.
    keepalive 128;
    # Below Node's 5-second keep-alive timeout, so nginx never reuses a
    # connection that the app is just closing (which would return a 502).
    keepalive_timeout 4s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # The app trusts one proxy hop and reads the client IP from here.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
