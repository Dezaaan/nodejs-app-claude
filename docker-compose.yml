services:
  postgres:
    image: postgres:17
    container_name: nodejs-postgres
    environment:
      POSTGRES_DB: nodejs_app_claude
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nodejs_postgres_data:/var/lib/postgresql/data

  # Database browser for local development: http://localhost:8080
  adminer:
    image: adminer:5
    container_name: nodejs-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

volumes:
  nodejs_postgres_data:
