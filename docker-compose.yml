services:
  postgres:
    image: postgres:17
    container_name: nodejs-postgres
    # Tuned for a 12-core, 16 GB development machine running the 10M-user
    # load-test database. The defaults (128 MB shared_buffers) are sized for
    # tiny databases.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=200
      - -c
      - max_wal_size=8GB
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_maintenance_workers=4
    # Parallel queries and index builds use shared memory; Docker's default
    # of 64 MB is too small for them.
    shm_size: 1gb
    environment:
      POSTGRES_DB: nodejs_app_claude
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nodejs_postgres_data:/var/lib/postgresql/data

  # Shared state for every API copy: rate limit counters now, cache later.
  # Nothing here is the source of truth, so it is not saved to disk, and when
  # it is full the least recently used keys are dropped.
  redis:
    image: redis:8
    container_name: nodejs-redis
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:6379:6379"

  # The API scaled out behind a load balancer, against the load-test
  # database. Started only with the "scaling" profile:
  #   docker compose --profile scaling up -d --build --scale api=4
  api:
    build: .
    profiles: ["scaling"]
    env_file:
      - path: .env.load
        required: false
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nodejs_app_claude_load
      REDIS_URL: redis://redis:6379/2
      # nginx is the one proxy in front of the app.
      TRUST_PROXY_HOPS: 1
    deploy:
      replicas: 4
    depends_on:
      - postgres
      - redis

  # Spreads requests across the API copies: http://localhost:3200
  nginx:
    image: nginx:1.29
    container_name: nodejs-nginx
    profiles: ["scaling"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:3200:80"
    depends_on:
      - api

  # Database browser for local development: http://localhost:8080
  adminer:
    image: adminer:5
    container_name: nodejs-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

volumes:
  nodejs_postgres_data:
