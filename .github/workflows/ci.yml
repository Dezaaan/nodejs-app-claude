name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nodejs_app_claude_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create test environment
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/nodejs_app_claude_test
          CLIENT_ORIGIN=http://localhost:5173
          LOG_LEVEL=silent
          JWT_SECRET=ci-only-secret-that-is-at-least-32-characters-long
          EOF

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate:test
      - run: npm run test:all
